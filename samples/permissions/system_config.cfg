# System Configuration File
# This file contains sensitive system settings
# It should have restricted permissions (600 or rw-------)

[System]
hostname = secure-server
domain = example.com
timezone = UTC
language = en_US.UTF-8
keyboard = us
boot_timeout = 30
enable_ipv6 = true
enable_firewall = true
enable_selinux = enforcing
enable_apparmor = true
enable_audit = true
enable_secure_boot = true

[Network]
interface = eth0
ip_address = 192.168.1.100
netmask = 255.255.255.0
gateway = 192.168.1.1
dns_servers = 8.8.8.8,8.8.4.4
dhcp = false
proxy_enabled = false
proxy_server = 
proxy_port = 
proxy_user = 
proxy_password = 

[Security]
password_min_length = 12
password_require_uppercase = true
password_require_lowercase = true
password_require_numbers = true
password_require_special = true
password_max_age = 90
password_history = 5
account_lockout_threshold = 5
account_lockout_duration = 30
session_timeout = 15
failed_login_delay = 3
enable_2fa = true
2fa_method = totp
encryption_algorithm = AES-256-GCM
hash_algorithm = SHA-512
ssl_min_version = TLSv1.2
cipher_suite = HIGH:!aNULL:!MD5:!RC4

[Authentication]
auth_order = local,ldap,radius
enable_pam = true
enable_sudo = true
sudo_group = wheel
enable_ssh = true
ssh_port = 22
ssh_protocol = 2
ssh_permit_root_login = no
ssh_password_authentication = no
ssh_pubkey_authentication = yes
ssh_x11_forwarding = no
ssh_max_auth_tries = 3
ssh_allow_users = admin,operator
ssh_allow_groups = sysadmin,secops
ssh_deny_users = guest
ssh_deny_groups = 

[Logging]
log_level = info
log_facility = local7
log_max_size = 100M
log_rotate_count = 10
log_compress = true
remote_logging = true
syslog_server = logs.example.com
syslog_port = 514
syslog_protocol = tcp
audit_level = high
audit_backlog = 8192

[Services]
enable_cron = true
enable_ntp = true
ntp_servers = pool.ntp.org
enable_mail = false
mail_relay = smtp.example.com
enable_http = false
enable_https = true
https_port = 443
enable_ftp = false
enable_telnet = false
enable_snmp = false
enable_cups = false
enable_samba = false
enable_nfs = false

[Updates]
auto_updates = true
update_schedule = daily
update_hour = 3
update_minute = 30
security_updates_only = false
notify_updates = true
notify_email = admin@example.com

[Backup]
backup_enabled = true
backup_method = rsync
backup_schedule = daily
backup_hour = 2
backup_minute = 0
backup_retention = 30
backup_destination = /mnt/backup
backup_remote = true
backup_remote_host = backup.example.com
backup_remote_user = backup
backup_remote_path = /backups/secure-server
backup_encryption = true
backup_compression = true

[Monitoring]
enable_monitoring = true
monitoring_agent = prometheus
monitoring_interval = 60
monitoring_server = monitor.example.com
monitoring_port = 9090
enable_health_checks = true
health_check_interval = 300
alert_email = alerts@example.com
alert_threshold_cpu = 90
alert_threshold_memory = 85
alert_threshold_disk = 80
alert_threshold_load = 10

[Compliance]
compliance_standard = PCI-DSS,HIPAA,GDPR
enable_compliance_checks = true
compliance_check_schedule = weekly
compliance_report_email = compliance@example.com
enable_file_integrity = true
file_integrity_paths = /etc,/bin,/sbin,/usr/bin,/usr/sbin
file_integrity_exclude = /etc/mtab,/etc/resolv.conf

# End of configuration file
